version: 2

models:
  - name: stg_stock_price
    columns:
      - name: ticker
        tests:
          - not_null
      - name: trade_date
        tests:
          - not_null
      - name: close_price
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ticker
              - trade_date

  - name: stg_fx_rate
    columns:
      - name: rate_date
        tests:
          - not_null
          - unique
      - name: usd_vnd_rate
        tests:
          - not_null