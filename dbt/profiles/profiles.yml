finance_elt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: warehouse-db
      port: 5432
      user: "{{ env_var('WAREHOUSE_DB_USER') }}"
      pass: "{{ env_var('WAREHOUSE_DB_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB_NAME') }}"
      schema: staging
      threads: 4