finance_elt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_DB_HOST', 'warehouse-db') }}"
      port: "{{ env_var('WAREHOUSE_DB_PORT', '5432') | as_number }}"
      user: "{{ env_var('WAREHOUSE_DB_USER') }}"
      pass: "{{ env_var('WAREHOUSE_DB_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB_NAME') }}"
      schema: staging
      threads: 4
      