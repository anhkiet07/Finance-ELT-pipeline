version: "3.8"

x-airflow-common:
  &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
    WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
    DBT_PROFILES_DIR: /opt/airflow/dbt/profiles
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../plugins:/opt/airflow/plugins
    - ../scripts:/opt/airflow/scripts
    - ../dbt:/opt/airflow/dbt
  depends_on:
    airflow-db:
      condition: service_healthy

services:
    airflow-db:
        image: postgres:16-alpine
        container_name: airflow-db
        environment:
            POSTGRES_USER: ${AIRFLOW_DB_USER}
            POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
            POSTGRES_DB: ${AIRFLOW_DB_NAME}
        volumes:
            - airflow-db-data:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
            interval: 5s
            retries: 5
    
    warehouse-db:
        image: postgres:16-alpine
        container_name: warehouse-db
        environment:
            POSTGRES_USER: ${WAREHOUSE_DB_USER}
            POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
            POSTGRES_DB: ${WAREHOUSE_DB_NAME}
        volumes:
            - warehouse-db-data:/var/lib/postgresql/data
        ports:
            - "5434:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${WAREHOUSE_DB_USER}"]
            interval: 5s
            retries: 5

    airflow-init:
        <<: *airflow-common
        container_name: airflow-init
        entrypoint: /bin/bash
        command:
            - -c
            - |
                airflow db migrate
                airflow users create \
                    --username ${AIRFLOW_ADMIN_USER} \
                    --password ${AIRFLOW_ADMIN_PASSWORD} \
                    --firstname Admin \
                    --lastname User \
                    --role Admin \
                    --email ${AIRFLOW_ADMIN_EMAIL}

    airflow-webserver:
        <<: *airflow-common
        container_name: airflow-webserver
        command: webserver
        ports:
            - "8080:8080"
        depends_on:
            airflow-init:
                condition: service_completed_successfully

    airflow-scheduler:
        <<: *airflow-common
        container_name: airflow-scheduler
        command: scheduler
        depends_on:
            airflow-init:
                condition: service_completed_successfully   

volumes:
    airflow-db-data:
    warehouse-db-data:

